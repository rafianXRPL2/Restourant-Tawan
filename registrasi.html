<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi Pelanggan - Ta Wan Restaurant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(17, 10, 10, 0.85) 0%, rgba(142, 22, 22, 0.75) 100%),
                  url("Gambar/image copy 11.png");
      background-size: cover;
      background-position: center;
      padding: 30px 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      transition: var(--transition);
      animation: fadeInScale 0.45s ease-out;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-logo {
      width: 80px;
      height: auto;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      background: #FFFFFF;
      padding: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .auth-card h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--primary);
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #D8CFC4;
      font-size: 13.5px;
      color: var(--text-dark);
      background: #FFFFFF;
      outline: none;
      transition: var(--transition);
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(142, 22, 22, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border-radius: var(--radius-full);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(142, 22, 22, 0.3);
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(142, 22, 22, 0.45);
    }

    .auth-footer {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: var(--transition);
    }

    .auth-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .back-home {
      display: inline-block;
      margin-top: 10px;
      font-size: 12.5px;
      color: #635A5A;
      text-decoration: none;
      transition: var(--transition);
    }

    .back-home:hover {
      color: var(--primary);
    }

    @media (max-width: 500px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html">
      <img src="Gambar/logo.jpg" alt="Logo Ta Wan" class="auth-logo">
    </a>
    <h2>Daftar Akun Baru</h2>
    <p class="auth-subtitle">Bergabunglah dan nikmati berbagai promo eksklusif Ta Wan</p>

    <form action="login.html" method="get">
      <div class="form-grid">
        <div class="form-group full">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="form-group full">
          <label for="alamat">Alamat Lengkap</label>
          <input type="text" id="alamat" name="alamat" placeholder="Jalan, Kota, Kode Pos" required>
        </div>

        <div class="form-group">
          <label for="telepon">Nomor Telepon</label>
          <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="username">Username Baru</label>
          <input type="text" id="username" name="username" placeholder="Buat username" required>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Daftarkan Sekarang</button>
    </form>

    <div class="auth-footer">
      <p>Sudah memiliki akun terdaftar? <a href="login.html">Masuk di Sini</a></p>
      <a href="index.html" class="back-home">&larr; Kembali ke Beranda Ta Wan</a>
    </div>
  </div>

</body>
</html>
