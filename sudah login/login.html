<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Member - Ta Wan Restaurant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(17, 10, 10, 0.85) 0%, rgba(142, 22, 22, 0.75) 100%),
                  url("Gambar/image copy 11.png");
      background-size: cover;
      background-position: center;
      padding: 24px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      transition: var(--transition);
      animation: fadeInScale 0.45s ease-out;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-logo {
      width: 90px;
      height: auto;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      background: #FFFFFF;
      padding: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .auth-card h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--primary);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #D8CFC4;
      font-size: 14px;
      color: var(--text-dark);
      background: #FFFFFF;
      outline: none;
      transition: var(--transition);
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(142, 22, 22, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border-radius: var(--radius-full);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(142, 22, 22, 0.3);
      transition: var(--transition);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(142, 22, 22, 0.45);
    }

    .auth-footer {
      margin-top: 22px;
      font-size: 13.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 18px;
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: var(--transition);
    }

    .auth-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    .back-home {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #635A5A;
      text-decoration: none;
      transition: var(--transition);
    }

    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="home.html">
      <img src="Gambar/logo.jpg" alt="Logo Ta Wan" class="auth-logo">
    </a>
    <h2>Masuk ke Akun</h2>
    <p class="auth-subtitle">Hangatkan momen kuliner bersama Sobat Ta Wan</p>

    <form action="home.html" method="get">
      <div class="form-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username Anda" required>
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi (Password)</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Login Sekarang</button>
    </form>

    <div class="auth-footer">
      <p>Belum memiliki akun? <a href="registrasi.html">Daftar Akun Baru</a></p>
      <a href="../home.html" class="back-home">&larr; Kembali ke Beranda Ta Wan</a>
    </div>
  </div>

</body>
</html>
